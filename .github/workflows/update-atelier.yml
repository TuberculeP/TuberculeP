# À déposer dans TuberculeP/TuberculeP sous .github/workflows/update-atelier.yml
name: Mise à jour de l'atelier

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Régénérer la section atelier
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Dépôts déjà mis en avant plus haut dans le README
            const EXCLUS = new Set([
              'TuberculeP', 'Magic-Knob', 'AlexandreBot',
              'stan', 'board-game-kit', 'linear-context-agent',
            ]);

            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: 'TuberculeP',
              per_page: 100,
              sort: 'pushed',
            });

            const lignes = repos
              .filter(r => !r.fork && !r.archived && !EXCLUS.has(r.name))
              .slice(0, 8)
              .map(r => {
                const desc = r.description || 'sans description, et ça restera comme ça';
                const langue = r.language ? ` \`${r.language}\`` : '';
                return `- [**${r.name}**](${r.html_url})${langue} : ${desc}`;
              });

            const bloc = [
              '<!-- ATELIER:START -->',
              '',
              ...lignes,
              '',
              `_Régénéré automatiquement le ${new Date().toLocaleDateString('fr-FR')}._`,
              '',
              '<!-- ATELIER:END -->',
            ].join('\n');

            const readme = fs.readFileSync('README.md', 'utf8');
            const maj = readme.replace(
              /<!-- ATELIER:START -->[\s\S]*?<!-- ATELIER:END -->/,
              bloc
            );

            if (maj !== readme) fs.writeFileSync('README.md', maj);

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: mise à jour de l'atelier"
          git push